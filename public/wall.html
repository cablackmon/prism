<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KYST Wall</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #start { position:fixed; inset:0; display:grid; place-items:center; background:#0b0e16; color:#eef3ff;
           font:20px/1.5 ui-sans-serif,-apple-system,sans-serif; z-index:10; cursor:pointer; }
  #start .card { text-align:center; padding:32px 40px; border:1px solid #2a3348; border-radius:18px; background:#121725; }
  #start .big { font-size:28px; font-weight:800; margin-bottom:8px; }
  #start .sub { color:#9aa8c1; font-size:15px; }
  #voice { position:fixed; right:max(22px,env(safe-area-inset-right)); bottom:max(22px,env(safe-area-inset-bottom));
           z-index:8; display:flex; align-items:center; gap:12px; font:600 15px/1.25 ui-sans-serif,-apple-system,sans-serif; }
  #voice-status { max-width:230px; padding:10px 14px; border-radius:999px; color:#eef3ff;
                  background:rgba(11,14,22,.88); border:1px solid rgba(148,163,184,.36);
                  box-shadow:0 8px 28px rgba(0,0,0,.32); backdrop-filter:blur(8px); }
  #voice-status:empty { display:none; }
  #mic { width:72px; height:72px; border:0; border-radius:50%; color:white; background:#3759d7;
         box-shadow:0 10px 30px rgba(0,0,0,.4); display:grid; place-items:center; cursor:pointer;
         touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  #mic svg { width:34px; height:34px; fill:currentColor; }
  #mic.listening { background:#d43c56; animation:pulse 1.2s infinite; }
  #mic.thinking { background:#8b5cf6; }
  #mic.speaking { background:#168768; }
  #mic.unavailable { background:#5c6473; }
  #mic:focus-visible, #chat-close:focus-visible, #fullscreen:focus-visible {
    outline:3px solid #eef3ff; outline-offset:3px;
  }
  #chat-panel { position:fixed; right:max(22px,env(safe-area-inset-right));
                bottom:max(108px,calc(env(safe-area-inset-bottom) + 108px)); z-index:7;
                width:min(410px,calc(100vw - 28px)); max-height:min(68vh,620px); color:#eef3ff;
                background:rgba(11,14,22,.96); border:1px solid rgba(148,163,184,.36); border-radius:20px;
                box-shadow:0 18px 54px rgba(0,0,0,.52); backdrop-filter:blur(14px);
                display:flex; flex-direction:column; overflow:hidden;
                font:15px/1.42 ui-sans-serif,-apple-system,sans-serif;
                transform:translateX(calc(100% + 34px)); opacity:0; pointer-events:none;
                transition:transform .22s ease,opacity .18s ease; }
  #chat-panel.open { transform:translateX(0); opacity:1; pointer-events:auto; }
  #chat-header { min-height:52px; padding:0 12px 0 17px; display:flex; align-items:center; gap:10px;
                 border-bottom:1px solid rgba(148,163,184,.22); }
  #chat-title { flex:1; font-weight:800; letter-spacing:.01em; }
  #chat-close { width:38px; height:38px; border:0; border-radius:11px; color:#cbd5e1;
                background:transparent; display:grid; place-items:center; cursor:pointer; font-size:25px;
                line-height:1; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  #chat-close:active { background:rgba(148,163,184,.16); }
  #chat-log { min-height:92px; overflow-y:auto; overscroll-behavior:contain; padding:15px 14px 10px;
              display:flex; flex-direction:column; gap:12px; scrollbar-width:thin; }
  #chat-empty { color:#8f9db6; text-align:center; padding:23px 8px; font-size:14px; }
  .chat-turn { display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:88%; padding:10px 12px; border-radius:15px; overflow-wrap:anywhere; white-space:pre-wrap; }
  .bubble.you { align-self:flex-end; color:#fff; background:#3759d7; border-bottom-right-radius:5px; }
  .bubble.nox { align-self:flex-start; color:#eef3ff; background:#222a3a;
                border:1px solid rgba(148,163,184,.22); border-bottom-left-radius:5px; }
  .bubble-label { display:block; margin-bottom:3px; font-size:11px; line-height:1.2;
                  font-weight:800; letter-spacing:.045em; text-transform:uppercase; opacity:.72; }
  #chat-progress { min-height:48px; padding:0 17px; display:flex; align-items:center; gap:9px;
                   color:#cbd5e1; border-top:1px solid rgba(148,163,184,.22); font-size:13px; font-weight:700; }
  #chat-progress-dot { width:9px; height:9px; flex:0 0 auto; border-radius:50%; background:#3759d7; }
  #chat-progress[data-state="listening"] #chat-progress-dot { background:#d43c56; animation:pulseDot 1.2s infinite; }
  #chat-progress[data-state="thinking"] #chat-progress-dot { background:#8b5cf6; animation:pulseDot 1.2s infinite; }
  #chat-progress[data-state="speaking"] #chat-progress-dot { background:#168768; animation:pulseDot 1.2s infinite; }
  #chat-progress[data-state="unavailable"] #chat-progress-dot { background:#5c6473; }
  #wall-tools { position:fixed; top:max(14px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right));
                z-index:8; }
  #fullscreen { width:44px; height:44px; border:1px solid rgba(148,163,184,.36); border-radius:12px;
                color:#eef3ff; background:rgba(11,14,22,.78); box-shadow:0 8px 24px rgba(0,0,0,.28);
                backdrop-filter:blur(8px); display:grid; place-items:center; cursor:pointer;
                touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  #fullscreen svg { width:23px; height:23px; fill:currentColor; }
  #fullscreen .exit-icon, #fullscreen[data-active="true"] .enter-icon { display:none; }
  #fullscreen[data-active="true"] .exit-icon { display:block; }
  #fullscreen.unavailable { background:rgba(92,100,115,.92); }
  #toast { position:fixed; top:max(68px,calc(env(safe-area-inset-top) + 68px)); right:max(14px,env(safe-area-inset-right));
           z-index:9; max-width:240px; padding:10px 14px; border-radius:10px; color:#eef3ff;
           background:rgba(11,14,22,.92); border:1px solid rgba(148,163,184,.36);
           font:600 14px/1.3 ui-sans-serif,-apple-system,sans-serif; opacity:0; transform:translateY(-5px);
           pointer-events:none; transition:opacity .16s ease,transform .16s ease; }
  #toast.visible { opacity:1; transform:translateY(0); }
  @keyframes pulse { 50% { transform:scale(1.07); box-shadow:0 10px 38px rgba(212,60,86,.62); } }
  @keyframes pulseDot { 50% { transform:scale(1.35); opacity:.62; } }
  @media (max-width:520px) {
    #chat-panel { right:14px; bottom:max(102px,calc(env(safe-area-inset-bottom) + 102px));
                  width:calc(100vw - 28px); max-height:64vh; }
    #voice-status { display:none; }
  }
</style>
</head>
<body>
<iframe id="board-frame" src="https://kyst-wall-proxy.fly.dev/" allow="autoplay; fullscreen; microphone"></iframe>
<script>
  (() => {
    const url = new URL(window.location.href);
    const handoff = url.searchParams.get("handoff");
    if (!handoff) return;
    document.getElementById("board-frame").src =
      "https://kyst-wall-proxy.fly.dev/bootstrap?handoff=" + encodeURIComponent(handoff);
    url.searchParams.delete("handoff");
    history.replaceState(null, "", url.pathname + url.search + url.hash);
  })();
</script>
<div id="start"><div class="card"><div class="big">Tap once to start the board</div>
<div class="sub">Keeps the screen from timing out</div></div></div>
<div id="voice" hidden>
  <div id="voice-status" role="status" aria-live="polite">Loading voice…</div>
  <button id="mic" type="button" aria-label="Ask NOX" title="Ask NOX">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-3.07A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"/></svg>
  </button>
</div>
<section id="chat-panel" aria-label="Ask NOX conversation" aria-hidden="true">
  <div id="chat-header">
    <div id="chat-title">Ask NOX</div>
    <button id="chat-close" type="button" aria-label="Close conversation" title="Close conversation">&times;</button>
  </div>
  <div id="chat-log" role="log" aria-live="polite" aria-relevant="additions text">
    <div id="chat-empty">Tap the mic and ask anything about the family board.</div>
  </div>
  <div id="chat-progress" data-state="ready" role="status" aria-live="polite">
    <span id="chat-progress-dot" aria-hidden="true"></span>
    <span id="chat-progress-text">Loading voice…</span>
  </div>
</section>
<div id="wall-tools" hidden>
  <button id="fullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" data-active="false">
    <svg class="enter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5a1 1 0 0 0 0-2H3a1 1 0 0 0-1 1v6a1 1 0 0 0 2 0Zm16 0a1 1 0 0 0 2 0V3a1 1 0 0 0-1-1h-6a1 1 0 1 0 0 2h5v5ZM9 20H4v-5a1 1 0 1 0-2 0v6a1 1 0 0 0 1 1h6a1 1 0 1 0 0-2Zm12-6a1 1 0 0 0-1 1v5h-5a1 1 0 1 0 0 2h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1Z"/></svg>
    <svg class="exit-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2a1 1 0 0 0-1 1v5H3a1 1 0 0 0 0 2h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1Zm6 8h6a1 1 0 1 0 0-2h-5V3a1 1 0 1 0-2 0v6a1 1 0 0 0 1 1ZM9 14H3a1 1 0 1 0 0 2h5v5a1 1 0 1 0 2 0v-6a1 1 0 0 0-1-1Zm12 0h-6a1 1 0 0 0-1 1v6a1 1 0 1 0 2 0v-5h5a1 1 0 1 0 0-2Z"/></svg>
  </button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/voice-streaming.js"></script>
<script>
// Silk keep-alive: a looping silent audio track makes the browser treat the tab
// as actively playing media, so the Echo Show doesn't bounce back to its home
// screen. One tap is required — browsers refuse to start audio untouched.
const silentWav = (() => {
  const rate = 8000, secs = 1, n = rate * secs;
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const s = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  s(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); s(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, "data");
  v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
})();
const audio = new Audio(silentWav);
audio.loop = true;
audio.volume = 0.01;
const voiceAudio = new Audio(silentWav);
voiceAudio.volume = 0.01;
let wakeLock = null;
async function grabWakeLock() {
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.getElementById("start").addEventListener("click", async () => {
  try { await audio.play(); } catch (e) {}
  try { await voiceAudio.play(); voiceAudio.pause(); voiceAudio.currentTime = 0; } catch (e) {}
  await grabWakeLock();
  document.getElementById("start").style.display = "none";
  document.getElementById("voice").hidden = false;
  document.getElementById("wall-tools").hidden = false;
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { audio.play().catch(() => {}); grabWakeLock(); }
});

// Prism has no push channel, so refresh the embedded board every 10 minutes.
const boardFrame = document.querySelector("iframe");
const proxyRoot = "https://kyst-wall-proxy.fly.dev/";
setInterval(() => { boardFrame.src = proxyRoot; }, 10 * 60 * 1000);

const fullscreenButton = document.getElementById("fullscreen");
const toast = document.getElementById("toast");
let toastTimer = null;
function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}
function updateFullscreenButton() {
  const active = Boolean(fullscreenElement());
  fullscreenButton.dataset.active = String(active);
  fullscreenButton.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
  fullscreenButton.title = active ? "Exit fullscreen" : "Enter fullscreen";
}
function showToast(message) {
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add("visible");
  fullscreenButton.classList.add("unavailable");
  fullscreenButton.setAttribute("aria-label", message);
  fullscreenButton.title = message;
  toastTimer = setTimeout(() => {
    toast.classList.remove("visible");
    fullscreenButton.classList.remove("unavailable");
    updateFullscreenButton();
  }, 2400);
}
function notifyBoardActivity() {
  boardFrame.contentWindow?.postMessage({ type:"kyst-user-activity" }, "https://kyst-wall-proxy.fly.dev");
}
async function toggleFullscreen() {
  notifyBoardActivity();
  try {
    if (fullscreenElement()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (!exit) throw new Error("Fullscreen exit is unsupported");
      await Promise.resolve(exit.call(document));
    } else {
      const enter = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
      if (!enter) throw new Error("Fullscreen is unsupported");
      await Promise.resolve(enter.call(document.documentElement));
    }
    updateFullscreenButton();
  } catch (error) {
    showToast("Fullscreen unavailable");
  }
}
fullscreenButton.addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", updateFullscreenButton);
document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

// Voice Ask-NOX stays outside Prism. Audio crosses to a tiny same-origin
// bridge injected by the header proxy, so Prism's authenticated session is
// checked without exposing a token or modifying the vanilla app.
const mic = document.getElementById("mic");
const voiceStatus = document.getElementById("voice-status");
const chatPanel = document.getElementById("chat-panel");
const chatClose = document.getElementById("chat-close");
const chatLog = document.getElementById("chat-log");
const chatEmpty = document.getElementById("chat-empty");
const chatProgress = document.getElementById("chat-progress");
const chatProgressText = document.getElementById("chat-progress-text");
let bridgeReady = false;
let recorder = null;
let recordingStream = null;
let recordingChunks = [];
let recordingMimeType = "audio/webm";
let recordingStartedAt = 0;
let silenceTimer = null;
let maxTimer = null;
let audioContext = null;
let captureProcessor = null;
let activeRequestId = null;
let activeRequestMediaUrl = null;
let pendingPlaybackRequestId = null;
let activeRecordingBlob = null;
let batchSubmitted = false;
let streamingRequest = false;
const resampleState = {};
const chatTurns = new Map();

function requestStreamConfig() {
  boardFrame.contentWindow?.postMessage({ type:"kyst-voice-stream-ticket" }, "https://kyst-wall-proxy.fly.dev");
}

function appendChatDelta(requestId, field, text) {
  if (!text) return;
  const turn = ensureChatTurn(requestId);
  const next = `${turn[field] || ""}${text}`;
  updateChatTurn(requestId, field === "transcript" ? next : null, field === "answer" ? next : null);
}

function submitBatchFallback(requestId, reason) {
  if (requestId !== activeRequestId || batchSubmitted || !activeRecordingBlob) return false;
  batchSubmitted = true;
  streamingRequest = false;
  activeRecordingBlob.arrayBuffer().then((buffer) => {
    if (requestId !== activeRequestId) return;
    console.info("kyst_voice_fallback", { requestId, reason });
    boardFrame.contentWindow.postMessage({
      type: "kyst-voice-ask", requestId,
      mimeType: recordingMimeType.split(";", 1)[0], audio: buffer,
    }, "https://kyst-wall-proxy.fly.dev", [buffer]);
  }).catch(() => {
    if (requestId === activeRequestId) {
      activeRequestId = null;
      setVoiceState("ready", "NOX could not receive that recording. Tap to retry.");
    }
  });
  return true;
}

function stopBatchPlayback() {
  voiceAudio.onended = null;
  voiceAudio.onerror = null;
  voiceAudio.pause();
  voiceAudio.currentTime = 0;
  if (activeRequestMediaUrl) {
    URL.revokeObjectURL(activeRequestMediaUrl);
    activeRequestMediaUrl = null;
  }
  pendingPlaybackRequestId = null;
}

function cancelActiveVoice(reason = "barge_in") {
  const requestId = activeRequestId;
  streamClient.cancel(reason);
  stopBatchPlayback();
  if (recorder) {
    cleanupRecording();
    recorder = null;
  }
  if (requestId) {
    boardFrame.contentWindow?.postMessage({
      type: "kyst-voice-cancel", requestId,
    }, "https://kyst-wall-proxy.fly.dev");
  }
  activeRequestId = null;
  activeRecordingBlob = null;
  batchSubmitted = false;
  streamingRequest = false;
}

const streamClient = new KystVoiceStreaming.VoiceStreamClient({
  playAudio: (chunk, format, requestId) => progressiveAudio.push(chunk, format, requestId),
  stopAudio: () => progressiveAudio.stop(),
  onFallback: ({ requestId, reason }) => {
    streamingRequest = false;
    if (activeRecordingBlob) submitBatchFallback(requestId, reason);
  },
  onEvent: (message) => {
    if (message.requestId && message.requestId !== activeRequestId) return;
    if (message.type === "transcript.delta") appendChatDelta(message.requestId, "transcript", message.text);
    if (message.type === "answer.delta") {
      appendChatDelta(message.requestId, "answer", message.text);
      setVoiceState("thinking", "Preparing NOX's voice…");
    }
    if (message.type === "audio.start" || message.type === "audio.first_chunk") {
      setVoiceState("speaking", "NOX is speaking…");
    }
    if (message.type === "complete") progressiveAudio.finish(message.requestId);
    if (message.type === "audio.playback_ended") {
      activeRequestId = null;
      activeRecordingBlob = null;
      setVoiceState("ready", "Tap to ask NOX");
    }
    if (message.type === "error") {
      activeRequestId = null;
      activeRecordingBlob = null;
      setVoiceState("ready", "Streaming audio stopped. Tap to try again.");
    }
  },
});

const progressiveAudio = (() => {
  let context = null;
  let nextPlayAt = 0;
  let sources = new Set();
  let mediaSource = null;
  let sourceBuffer = null;
  let queue = [];
  let mediaUrl = null;
  let requestId = null;
  let finishRequested = false;
  let playbackReady = null;
  let mp3Failure = null;
  let pendingPcm = 0;

  function notifyEnded() {
    const endedRequestId = requestId;
    if (!endedRequestId) return;
    stop();
    streamClient.onEvent({ type:"audio.playback_ended", requestId:endedRequestId });
  }

  function finishMp3() {
    if (!finishRequested || !mediaSource || !sourceBuffer || sourceBuffer.updating || queue.length) return;
    if (mediaSource.readyState === "open") mediaSource.endOfStream();
  }

  function flushMp3() {
    if (!sourceBuffer || sourceBuffer.updating) return;
    if (!queue.length) return finishMp3();
    try { sourceBuffer.appendBuffer(queue.shift()); }
    catch (error) { mp3Failure?.(error); }
  }

  function stop() {
    for (const source of sources) { try { source.stop(); } catch {} }
    sources = new Set();
    nextPlayAt = 0;
    queue = [];
    sourceBuffer = null;
    mediaSource = null;
    requestId = null;
    finishRequested = false;
    playbackReady = null;
    mp3Failure = null;
    pendingPcm = 0;
    voiceAudio.pause();
    voiceAudio.onended = null;
    if (mediaUrl) URL.revokeObjectURL(mediaUrl);
    mediaUrl = null;
  }

  function startMp3(nextRequestId) {
    stop();
    requestId = nextRequestId;
    if (!window.MediaSource?.isTypeSupported("audio/mpeg")) throw new Error("mp3_stream_unsupported");
    const nextMediaSource = new MediaSource();
    mediaSource = nextMediaSource;
    mediaUrl = URL.createObjectURL(nextMediaSource);
    voiceAudio.src = mediaUrl;
    voiceAudio.volume = 1;
    voiceAudio.onended = notifyEnded;
    playbackReady = new Promise((resolve, reject) => {
      const fail = (error = new Error("mp3_playback_failed")) => {
        reject(error);
        streamClient.failPlayback(nextRequestId);
      };
      mp3Failure = fail;
      nextMediaSource.addEventListener("error", fail, { once:true });
      nextMediaSource.addEventListener("sourceopen", async () => {
        if (mediaSource !== nextMediaSource || requestId !== nextRequestId) return reject(new Error("mp3_turn_cancelled"));
        try {
          const nextSourceBuffer = nextMediaSource.addSourceBuffer("audio/mpeg");
          if (mediaSource !== nextMediaSource || requestId !== nextRequestId) return reject(new Error("mp3_turn_cancelled"));
          sourceBuffer = nextSourceBuffer;
          nextSourceBuffer.addEventListener("updateend", flushMp3);
          nextSourceBuffer.addEventListener("error", fail, { once:true });
          voiceAudio.addEventListener("error", fail, { once:true });
          flushMp3();
          await voiceAudio.play();
          resolve();
        } catch (error) { reject(error); }
      }, { once:true });
    });
  }

  function push(chunk, format, nextRequestId) {
    if (format === "mp3") {
      if (requestId !== nextRequestId || !mediaSource) startMp3(nextRequestId);
      queue.push(chunk);
      flushMp3();
      return playbackReady;
    }
    if (format !== "pcm16") throw new Error(`unsupported_audio_format:${format}`);
    if (requestId !== nextRequestId) { stop(); requestId = nextRequestId; }
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    context ||= new AudioContextClass();
    const nextContext = context;
    pendingPcm += 1;
    return Promise.resolve(nextContext.state === "suspended" ? nextContext.resume() : undefined).then(() => {
      if (context !== nextContext || requestId !== nextRequestId || nextContext.state === "suspended") throw new Error("pcm_playback_unavailable");
      const samples = new Int16Array(chunk);
      const buffer = nextContext.createBuffer(1, samples.length, 16000);
      const channel = buffer.getChannelData(0);
      for (let index = 0; index < samples.length; index += 1) channel[index] = samples[index] / 32768;
      const source = nextContext.createBufferSource();
      source.buffer = buffer;
      source.connect(nextContext.destination);
      const startAt = Math.max(nextContext.currentTime + .015, nextPlayAt);
      nextPlayAt = startAt + buffer.duration;
      sources.add(source);
      source.addEventListener("ended", () => sources.delete(source), { once:true });
      source.addEventListener("ended", () => {
        if (finishRequested && sources.size === 0) notifyEnded();
      }, { once:true });
      source.start(startAt);
      if (requestId === nextRequestId) pendingPcm -= 1;
    }).catch((error) => {
      if (requestId === nextRequestId) pendingPcm -= 1;
      throw error;
    });
  }

  function finish(nextRequestId) {
    if (requestId !== nextRequestId) return;
    finishRequested = true;
    if (mediaSource) finishMp3();
    else if (sources.size === 0 && pendingPcm === 0) notifyEnded();
  }

  return { push, stop, finish };
})();

function setChatOpen(open) {
  chatPanel.classList.toggle("open", open);
  chatPanel.setAttribute("aria-hidden", String(!open));
}

function scrollChatToLatest() {
  requestAnimationFrame(() => { chatLog.scrollTop = chatLog.scrollHeight; });
}

function ensureChatTurn(requestId) {
  let turn = chatTurns.get(requestId);
  if (turn) return turn;
  chatEmpty.hidden = true;
  const container = document.createElement("div");
  container.className = "chat-turn";
  container.dataset.requestId = requestId;
  chatLog.appendChild(container);
  turn = { container, transcript: "", answer: "", userBubble: null, noxBubble: null };
  chatTurns.set(requestId, turn);
  return turn;
}

function updateChatTurn(requestId, transcript, answer) {
  if (!requestId) return;
  const turn = ensureChatTurn(requestId);
  if (transcript && transcript !== turn.transcript) {
    turn.transcript = transcript;
    if (!turn.userBubble) {
      turn.userBubble = document.createElement("div");
      turn.userBubble.className = "bubble you";
      turn.userBubble.innerHTML = '<span class="bubble-label">You said</span><span></span>';
      turn.container.appendChild(turn.userBubble);
    }
    turn.userBubble.lastElementChild.textContent = transcript;
  }
  if (answer && answer !== turn.answer) {
    turn.answer = answer;
    if (!turn.noxBubble) {
      turn.noxBubble = document.createElement("div");
      turn.noxBubble.className = "bubble nox";
      turn.noxBubble.innerHTML = '<span class="bubble-label">NOX</span><span></span>';
      turn.container.appendChild(turn.noxBubble);
    }
    turn.noxBubble.lastElementChild.textContent = answer;
  }
  scrollChatToLatest();
}

function setVoiceState(state, label) {
  mic.className = state === "ready" ? "" : state;
  mic.disabled = false;
  voiceStatus.textContent = label;
  chatProgress.dataset.state = state;
  chatProgressText.textContent = label;
  mic.setAttribute("aria-label", state === "listening" ? "Stop recording" : "Ask NOX");
}

function cleanupRecording() {
  clearTimeout(silenceTimer);
  clearTimeout(maxTimer);
  silenceTimer = null;
  maxTimer = null;
  if (captureProcessor) captureProcessor.disconnect();
  captureProcessor = null;
  if (audioContext) audioContext.close().catch(() => {});
  audioContext = null;
  if (recordingStream) recordingStream.getTracks().forEach((track) => track.stop());
  recordingStream = null;
}

function stopRecording() {
  if (recorder && recorder.state === "recording") recorder.stop();
}

function watchForSilence(stream, onPcm) {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;
  audioContext = new AudioContextClass();
  const source = audioContext.createMediaStreamSource(stream);
  captureProcessor = audioContext.createScriptProcessor(2048, 1, 1);
  captureProcessor.onaudioprocess = (event) => {
    if (recorder?.state !== "recording") return;
    onPcm(KystVoiceStreaming.pcm16FromFloat32(event.inputBuffer.getChannelData(0), audioContext.sampleRate, resampleState));
  };
  source.connect(captureProcessor);
  captureProcessor.connect(audioContext.destination);
  const analyser = audioContext.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
  const samples = new Uint8Array(analyser.fftSize);
  let heardSpeech = false;
  let quietSince = 0;
  const tick = () => {
    if (!recorder || recorder.state !== "recording") return;
    analyser.getByteTimeDomainData(samples);
    let sum = 0;
    for (const sample of samples) {
      const value = (sample - 128) / 128;
      sum += value * value;
    }
    const rms = Math.sqrt(sum / samples.length);
    const now = performance.now();
    if (rms > 0.025) {
      heardSpeech = true;
      quietSince = 0;
    } else if (heardSpeech) {
      if (!quietSince) quietSince = now;
      if (now - quietSince > 900 && now - recordingStartedAt > 1200) return stopRecording();
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

async function beginRecording() {
  setChatOpen(true);
  if (!bridgeReady) return setVoiceState("unavailable", "Board is still loading. Try again.");
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    return setVoiceState("unavailable", "Mic unavailable in this browser.");
  }
  try {
    voiceAudio.src = silentWav;
    voiceAudio.volume = 0.01;
    await voiceAudio.play();
    voiceAudio.pause();
    recordingStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true },
    });
    const preferred = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"]
      .find((type) => MediaRecorder.isTypeSupported(type));
    recorder = preferred ? new MediaRecorder(recordingStream, { mimeType: preferred }) : new MediaRecorder(recordingStream);
    recordingMimeType = recorder.mimeType || preferred || "audio/webm";
    recordingChunks = [];
    activeRecordingBlob = null;
    batchSubmitted = false;
    activeRequestId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
    ensureChatTurn(activeRequestId);
    const turnRequestId = activeRequestId;
    const turnRecorder = recorder;
    const turnStream = recordingStream;
    const turnChunks = recordingChunks;
    const turnMimeType = recordingMimeType;
    const trackSettings = turnStream.getAudioTracks()[0]?.getSettings?.() || {};
    console.info("kyst_voice_capture_settings", trackSettings);
    streamingRequest = streamClient.begin({ requestId: activeRequestId });
    turnRecorder.addEventListener("dataavailable", (event) => {
      if (!event.data.size) return;
      turnChunks.push(event.data);
    });
    turnRecorder.addEventListener("stop", async () => {
      if (activeRequestId !== turnRequestId || recorder !== turnRecorder) {
        turnStream.getTracks().forEach((track) => track.stop());
        return;
      }
      cleanupRecording();
      const blob = new Blob(turnChunks, { type: turnMimeType });
      activeRecordingBlob = blob;
      recorder = null;
      if (blob.size < 256) {
        streamClient.cancel("empty_recording");
        activeRequestId = null;
        return setVoiceState("ready", "I didn't hear anything. Tap to try again.");
      }
      setVoiceState("thinking", "NOX is thinking…");
      const speechEndedAt = Date.now();
      console.info("kyst_voice_timing", { requestId: turnRequestId, speech_end: speechEndedAt });
      if (streamingRequest && streamClient.end()) return;
      submitBatchFallback(turnRequestId, "stream_unavailable");
    }, { once:true });
    recordingStartedAt = performance.now();
    setVoiceState("listening", "Listening… tap to stop");
    recorder.start(40);
    watchForSilence(recordingStream, (pcm) => {
      if (streamingRequest) streamClient.sendPcm(pcm);
    });
    maxTimer = setTimeout(stopRecording, 10_000);
  } catch (error) {
    const failedRequestId = activeRequestId;
    streamClient.cancel("capture_setup_failed");
    cleanupRecording();
    recorder = null;
    if (activeRequestId === failedRequestId) activeRequestId = null;
    streamingRequest = false;
    setVoiceState("unavailable", "Mic unavailable. Check browser permission.");
  }
}

mic.addEventListener("click", () => {
  notifyBoardActivity();
  setChatOpen(true);
  if (recorder?.state === "recording") stopRecording();
  else if (pendingPlaybackRequestId && pendingPlaybackRequestId === activeRequestId) {
    pendingPlaybackRequestId = null;
    voiceAudio.play().catch(() => {
      pendingPlaybackRequestId = activeRequestId;
      setVoiceState("ready", "Tap the mic once to play the answer.");
    });
  }
  else if (activeRequestId) {
    cancelActiveVoice("barge_in");
    beginRecording();
  }
  else beginRecording();
});
chatClose.addEventListener("click", () => {
  notifyBoardActivity();
  setChatOpen(false);
});

window.addEventListener("message", async (event) => {
  if (event.origin !== "https://kyst-wall-proxy.fly.dev" || event.source !== boardFrame.contentWindow) return;
  const message = event.data || {};
  if (message.type === "kyst-voice-bridge-ready") {
    bridgeReady = true;
    requestStreamConfig();
    if (!recorder && !activeRequestId) setVoiceState("ready", "Tap to ask NOX");
    return;
  }
  if (message.type === "kyst-voice-stream-config") {
    try {
      streamClient.connect({ url:message.url, token:message.token });
    } catch (error) {
      console.warn("kyst_voice_stream_config_rejected", error?.message || "invalid config");
    }
    return;
  }
  if (message.requestId !== activeRequestId) return;
  if (message.type === "kyst-voice-thinking") return setVoiceState("thinking", "NOX is thinking…");
  if (message.type === "kyst-voice-progress") {
    updateChatTurn(message.requestId, message.transcript, message.answer);
    return setVoiceState("thinking", message.answer ? "Preparing NOX's voice…" : message.transcript ? "NOX is thinking…" : "NOX is thinking…");
  }
  if (message.type === "kyst-voice-error") {
    activeRequestId = null;
    activeRecordingBlob = null;
    return setVoiceState(message.status === 401 ? "unavailable" : "ready", message.error || "NOX could not answer.");
  }
  if (message.type === "kyst-voice-answer" && message.audio instanceof ArrayBuffer) {
    const requestId = message.requestId;
    updateChatTurn(message.requestId, message.transcript, message.answer);
    setVoiceState("speaking", "NOX is speaking…");
    const objectUrl = URL.createObjectURL(new Blob([message.audio], { type: message.mimeType || "audio/mpeg" }));
    activeRequestMediaUrl = objectUrl;
    voiceAudio.src = objectUrl;
    voiceAudio.loop = false;
    voiceAudio.volume = 1;
    voiceAudio.onended = () => {
      if (activeRequestId !== requestId) return;
      stopBatchPlayback();
      activeRequestId = null;
      activeRecordingBlob = null;
      setVoiceState("ready", "Tap to ask NOX");
    };
    voiceAudio.onerror = () => {
      if (activeRequestId !== requestId) return;
      stopBatchPlayback();
      activeRequestId = null;
      activeRecordingBlob = null;
      setVoiceState("ready", "Answer audio could not play. Tap to retry.");
    };
    try { await voiceAudio.play(); } catch {
      if (activeRequestId !== requestId) return;
      pendingPlaybackRequestId = requestId;
      setVoiceState("ready", "Tap the mic once to play the answer.");
    }
  }
});
function pingVoiceBridge() {
  boardFrame.contentWindow.postMessage({ type:"kyst-voice-ping" }, "https://kyst-wall-proxy.fly.dev");
}
boardFrame.addEventListener("load", pingVoiceBridge);
pingVoiceBridge();

// Reboot the complete kiosk page at 03:00 browser-local time each night.
function scheduleNightlyReload() {
  const now = new Date();
  const next = new Date(now);
  next.setHours(3, 0, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  setTimeout(() => window.location.reload(), next - now);
}
scheduleNightlyReload();
</script>
